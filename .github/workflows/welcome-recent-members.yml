# One-time: email members created on 2026-09-26 their temporary password.
# Trigger manually. Remove this workflow after it succeeds.

name: Send one-time welcome emails

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send welcome emails
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing CRON_SECRET repository secret"
            exit 1
          fi
          code=$(curl -sS -o /tmp/welcome.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "https://www.nchschessclub.com/api/cron/welcome-recent-members")
          echo "http $code"
          python3 - <<'PY'
          import json
          data = json.load(open("/tmp/welcome.json"))
          emailed = data.get("emailed") or []
          skipped = data.get("skipped") or []
          failed = data.get("failed") or {}
          print("ok", data.get("ok"))
          print("emailed", len(emailed))
          for person in emailed:
              print("emailed", person.get("name", ""))
          print("skipped", len(skipped))
          for person in skipped:
              print("skipped", person.get("name", ""))
          if failed.get("name"):
              print("failed", failed.get("name"))
          if data.get("error"):
              print("error", data.get("error"))
          PY
          test "$code" = "200"
